# ── Test configuration ─────────────────────────────────────────────────
# Integration tests boot the full Spring context with H2 in-memory and
# open-in-view DISABLED (same as production), so lazy-serialization bugs
# surface in CI exactly as they would at runtime.

spring.datasource.url=jdbc:h2:mem:recoverytest;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# Each test seeds only the data it needs.
recovery.seed-data=false

# Bounds mirror production defaults so segment assertions are meaningful.
recovery.max-retries=3
recovery.retry-cooldown-minutes=60
recovery.max-discount-percent=15
recovery.min-amount-for-discount=500
recovery.hv.max-retries=5
recovery.hv.max-discount-percent=25
recovery.hv.min-amount-for-discount=500

# No live LLM calls in tests.
llm.enabled=false
llm.api-key=
llm.model=claude-sonnet-4-6

logging.level.com.razorpay.recovery=WARN
