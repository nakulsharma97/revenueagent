spring.application.name=revenue-recovery-agent

# Port: Railway/Render inject PORT env var, which Spring Boot reads automatically.
# Locally defaults to 8080 when PORT is unset; on hosted platforms PORT is set.
server.port=${PORT:8080}

# Active profile: 'dev' uses in-memory H2 (zero setup), 'mysql' uses real MySQL.
spring.profiles.active=dev

# --- Recovery agent tuning (bounded-workflow limits enforced by RulesEngine) ---
# STANDARD customer bounds (default for everyone)
recovery.max-retries=3
recovery.retry-cooldown-minutes=60
recovery.max-discount-percent=15
recovery.min-amount-for-discount=500

# HIGH_VALUE customer bounds (top 20% by transaction value — wider limits)
recovery.hv.max-retries=5
recovery.hv.max-discount-percent=25
recovery.hv.min-amount-for-discount=500

# Seed deterministic demo data on startup (fixed Random seed 42 → reproducible metrics).
# Set false in automated tests.
recovery.seed-data=true

# --- LLM explanation layer ---
# Set ANTHROPIC_API_KEY as an environment variable to enable live LLM reasoning.
# The LLM only EXPLAINS decisions — the deterministic Next-Best-Action engine + RulesEngine
# always choose the action — so the app runs end-to-end identically with or without a key.
# llmDriven=true is set on an attempt ONLY when a real LLM response contributed.
llm.provider=anthropic
llm.model=claude-sonnet-4-6
llm.api-key=${ANTHROPIC_API_KEY:}
llm.enabled=${LLM_ENABLED:false}

# OSIV is disabled: all API responses are mapped to DTOs inside service-layer transactions
# (see com.razorpay.recovery.api.RecoveryApiService), so no entity lazy-loading happens
# during JSON serialization. Never re-enable open-in-view for lazy entity serialization.
spring.jpa.open-in-view=false

logging.level.com.razorpay.recovery=INFO

# Actuator: expose health endpoint for Railway/Render health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
